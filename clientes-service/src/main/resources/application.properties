# Microservicio de Clientes y Autenticacion
spring.application.name=clientes-service

server.port=8083
server.address=127.0.0.1

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./oyl_clientes;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carga inicial
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactivar consola H2 para proteger los datos
spring.h2.console.enabled=false

# Configuracion JWT
oyl.jwt.secret=${OYL_JWT_SECRET}