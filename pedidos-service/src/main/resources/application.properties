# Microservicio de Pedidos
spring.application.name=pedidos-service

# Puerto exclusivo
server.port=8084
server.address=127.0.0.1

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./oyl_pedidos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carga inicial de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactivar consola H2
spring.h2.console.enabled=false

# Comunicacion entre microservicios
oyl.productos.base-url=http://127.0.0.1:8081
oyl.inventario.base-url=http://127.0.0.1:8082
oyl.clientes.base-url=http://127.0.0.1:8083

# Seguridad JWT
oyl.jwt.secret=${OYL_JWT_SECRET}

# RECUPERACION AUTOMATICA DE PEDIDOS

oyl.recuperacion.enabled=true
oyl.recuperacion.intervalo-ms=30000

# Credencial de servicio para reservas de Inventario
oyl.inventario.secret=${OYL_INVENTARIO_SECRET}
