# Microservicio de Pedidos
spring.application.name=pedidos-service

# Puerto exclusivo
server.port=8084

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./oyl_pedidos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carga inicial de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola H2 para desarrollo local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Acceso exclusivamente local durante el desarrollo
server.address=127.0.0.1