# Nombre del microservicio
spring.application.name=inventario-service

# Configuracion del servidor
server.port=8082
server.address=127.0.0.1

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./oyl_inventario;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Inicializacion de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactivar consola H2
spring.h2.console.enabled=false

# Seguridad JWT
oyl.jwt.secret=${OYL_JWT_SECRET}

# Autenticacion entre microservicios
oyl.inventario.secret=${OYL_INVENTARIO_SECRET}
