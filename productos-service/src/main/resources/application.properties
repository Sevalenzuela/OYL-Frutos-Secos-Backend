
# Nombre del microservicio
spring.application.name=productos-service

# Puerto exclusivo del microservicio de productos
server.port=8081

# Base de datos H2 guardada en archivo
spring.datasource.url=jdbc:h2:file:./oyl_productos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Ejecutar data.sql despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola H2 para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
